name: diamondcrew-staffcenter
x-common: &common
  build: .
  image: diamondcrew-staffcenter:local
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=16m,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  expose:
    - "3000"
  networks:
    - proxy
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
services:
  staffcenter:
    <<: *common
    environment:
      NODE_ENV: production
      TRUST_PROXY_CIDRS: ${TRUST_PROXY_CIDRS:-}
      PORT: 3000
      APP_VARIANT: staff
      LAUNCHER_PROXY_ENABLED: ${LAUNCHER_PROXY_ENABLED:-false}
      LAUNCHER_IMAGE_ENABLED: ${LAUNCHER_IMAGE_ENABLED:-false}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI:-}
      DISCORD_ALLOWED_USER_IDS: ${DISCORD_ALLOWED_USER_IDS:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      PTERODACTYL_URL: ${PTERODACTYL_URL:-}
      PTERODACTYL_CLIENT_API_KEY: ${PTERODACTYL_CLIENT_API_KEY:-}
      STATUS_TARGETS: ${STATUS_TARGETS:-[]}
      STATUS_WEB_TARGETS: ${STATUS_WEB_TARGETS:-[]}
      PUBLIC_INCIDENT_TITLE: ${PUBLIC_INCIDENT_TITLE:-}
      PUBLIC_INCIDENT_MESSAGE: ${PUBLIC_INCIDENT_MESSAGE:-}
      PUBLIC_MAINTENANCE: ${PUBLIC_MAINTENANCE:-false}
      PUBLIC_MAINTENANCE_MESSAGE: ${PUBLIC_MAINTENANCE_MESSAGE:-}
  public-status:
    <<: *common
    environment:
      NODE_ENV: production
      TRUST_PROXY_CIDRS: ${TRUST_PROXY_CIDRS:-}
      PORT: 3000
      APP_VARIANT: public
      PTERODACTYL_URL: ${PTERODACTYL_URL:-}
      PTERODACTYL_CLIENT_API_KEY: ${PTERODACTYL_CLIENT_API_KEY:-}
      STATUS_TARGETS: ${STATUS_TARGETS:-[]}
      STATUS_WEB_TARGETS: ${STATUS_WEB_TARGETS:-[]}
      PUBLIC_INCIDENT_TITLE: ${PUBLIC_INCIDENT_TITLE:-}
      PUBLIC_INCIDENT_MESSAGE: ${PUBLIC_INCIDENT_MESSAGE:-}
      PUBLIC_MAINTENANCE: ${PUBLIC_MAINTENANCE:-false}
      PUBLIC_MAINTENANCE_MESSAGE: ${PUBLIC_MAINTENANCE_MESSAGE:-}
networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-diamondcrew-proxy}
